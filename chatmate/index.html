<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Chatmate English</title>
<meta name="description" content="Practise everyday English by chatting with friends, acquaintances and strangers who remember you.">
<meta name="theme-color" content="#E9EDF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chatmate">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen messaging app — header / scrolling thread / helper row + composer; bottom sheets for people, review and settings */
:root {
  --bg: #E9EDF2;
  --surface: #FFFFFF;
  --ink: #16202C;
  --muted: #5B6878;
  --line: #D5DCE5;
  --me: #2347C8;
  --me-ink: #FFFFFF;
  --them: #FFFFFF;
  --accent: #B8720F;
  --accent-soft: #FBEFD9;
  --good: #23784B;
  --bad: #B4401A;
  --shadow: 0 1px 2px rgba(22, 32, 44, .08);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E131A; --surface: #171F29; --ink: #E4EAF1; --muted: #8F9CAD; --line: #263142;
    --me: #3F69EE; --me-ink: #FFFFFF; --them: #1D2733; --accent: #EDB15A; --accent-soft: #33291A;
    --good: #5CC48C; --bad: #F08A63; --shadow: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--me); }

.app { height: 100%; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); max-width: 720px; margin: 0 auto; }

/* Header */
.top { display: flex; align-items: center; gap: 10px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--bg); }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; background: none; border: 0; padding: 0; text-align: left; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 18px; color: #fff; flex: none; position: relative; }
.top .avatar::after { content: ""; position: absolute; right: 0; bottom: 0; width: 10px; height: 10px; border-radius: 50%; background: #3BB273; border: 2px solid var(--bg); }
.who-text { min-width: 0; }
.who-name { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.1; display: flex; align-items: center; gap: 4px; }
.who-name svg { width: 14px; height: 14px; color: var(--muted); }
.who-meta { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.review-btn { height: 40px; padding: 0 14px; border-radius: 12px; border: 0; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; flex: none; }

/* Thread */
.thread { overflow-y: auto; padding-block: 16px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.day { align-self: center; font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.group { display: flex; flex-direction: column; gap: 3px; max-width: 82%; }
.group.them { align-self: flex-start; }
.group.me { align-self: flex-end; align-items: flex-end; }
.bubble { padding: 9px 13px; border-radius: 18px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: var(--shadow); }
.them .bubble { background: var(--them); border-bottom-left-radius: 6px; border: 0; text-align: left; display: inline-flex; gap: 8px; align-items: flex-end; }
.them .bubble:active { filter: brightness(.96); }
.them .bubble .spk { width: 14px; height: 14px; color: var(--muted); flex: none; margin-bottom: 3px; opacity: .7; }
.them .bubble.speaking .spk { color: var(--accent); opacity: 1; }
.me .bubble { background: var(--me); color: var(--me-ink); border-bottom-right-radius: 6px; }
.nudge { align-self: center; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); padding: 4px 10px; border-radius: 99px; }
.typing { align-self: flex-start; background: var(--them); border-radius: 18px; border-bottom-left-radius: 6px; padding: 12px 14px; display: flex; gap: 4px; box-shadow: var(--shadow); }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25 } 30% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } }
.card { align-self: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; line-height: 1.5; font-size: 14px; }
.card .k { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.card .go { color: var(--me); font-weight: 600; }
.card .mem { color: var(--muted); font-size: 13px; white-space: pre-wrap; }
.primary { align-self: flex-start; border: 0; background: var(--me); color: var(--me-ink); font-weight: 600; border-radius: 12px; padding: 10px 16px; }
.primary:disabled { opacity: .5; }

/* Bottom */
.bottom { border-top: 1px solid var(--line); background: var(--bg); padding-top: 8px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; }
.helpers { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.helpers::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 14px; color: var(--muted); }
.chip:disabled { opacity: .5; }
.sugs { display: flex; flex-direction: column; gap: 6px; }
.sug { text-align: left; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
.sug b { font-weight: 500; }
.sug span { font-size: 13px; color: var(--muted); }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 20px; padding: 10px 14px; font: inherit; font-size: 16px; line-height: 1.35; max-height: 120px; }
.composer textarea::placeholder { color: var(--muted); }
.round { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none; }
.round svg { width: 20px; height: 20px; }
.send { background: var(--me); color: var(--me-ink); }
.send:disabled { opacity: .4; }
.mic { background: var(--surface); border: 1px solid var(--line); }
.mic.on { background: var(--bad); color: #fff; border-color: var(--bad); }

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(8, 12, 18, .45); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 720px; max-height: 90%; overflow-y: auto; border-radius: 20px 20px 0 0; padding-top: 18px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet h2 { margin: 0; font-family: var(--display); font-size: 22px; text-wrap: balance; }
.sheet h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.sheet p { margin: 0; line-height: 1.55; }
.close { border: 0; background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 14px; }
.overall { line-height: 1.6; background: var(--surface); border-radius: 14px; padding: 12px 14px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.fix { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; line-height: 1.45; }
.fix .tag { align-self: flex-start; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.fix .tag.grammar { color: var(--bad); }
.fix .was { color: var(--muted); }
.fix .now { color: var(--good); font-weight: 600; }
.fix .why { font-size: 14px; color: var(--muted); }
.phrase b { font-family: var(--display); font-size: 17px; }
.empty { color: var(--muted); font-size: 14px; }
.personas { display: grid; gap: 10px; }
.persona { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 2px solid transparent; border-radius: 14px; padding: 12px; }
.persona[aria-current="true"] { border-color: var(--me); }
.persona div { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.persona span { font-size: 13px; color: var(--muted); line-height: 1.4; }
.level { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 2px; }
.tiers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tier { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 3px; }
.tier b { font-family: var(--display); font-size: 17px; }
.tier span { font-size: 13px; color: var(--muted); line-height: 1.4; }
.tier:disabled { opacity: .5; }
.danger { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; color: var(--bad); font-weight: 600; }
.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.loading { color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; }
.field input, .field select { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
.field small { color: var(--muted); font-size: 13px; line-height: 1.45; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.status { font-size: 14px; }
.status.ok { color: var(--good); } .status.bad { color: var(--bad); }

.feel { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; margin-top: 2px; line-height: 1.4; }
.feel .d { font-weight: 700; font-variant-numeric: tabular-nums; }
.feel .d.up { color: var(--good); } .feel .d.down { color: var(--bad); }
.composer textarea:disabled { opacity: .6; }
/* Voice call: one deliberate dark look in both themes */
.call { position: fixed; inset: 0; z-index: 15; background: #0F1724; color: #EEF3F9; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); color-scheme: dark; }
.call-top { width: 100%; max-width: 560px; display: flex; justify-content: space-between; font-size: 13px; color: #95A3B6; font-variant-numeric: tabular-nums; }
.call-who { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.call-avatar { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 44px; color: #fff; box-shadow: 0 0 0 0 rgba(242, 177, 76, 0); transition: box-shadow .25s; }
.call-avatar.talking { box-shadow: 0 0 0 6px rgba(242, 177, 76, .55), 0 0 0 14px rgba(242, 177, 76, .18); }
.call-avatar.hearing { box-shadow: 0 0 0 6px rgba(99, 140, 255, .55), 0 0 0 14px rgba(99, 140, 255, .18); }
.call-name { font-family: var(--display); font-weight: 700; font-size: 26px; }
.call-status { font-size: 14px; color: #B8C4D4; min-height: 1.4em; text-align: center; }
.call-feel { font-size: 13px; color: #95A3B6; min-height: 1.4em; text-align: center; }
.call-feel .up { color: #6DD39B; font-weight: 700; } .call-feel .down { color: #F59173; font-weight: 700; }
.call-caps { flex: 1; min-height: 0; width: 100%; max-width: 560px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-block: 4px; }
.cap { max-width: 88%; padding: 8px 12px; border-radius: 14px; line-height: 1.4; font-size: 15px; overflow-wrap: anywhere; }
.cap.them { align-self: flex-start; background: #1C2738; }
.cap.me { align-self: flex-end; background: #2347C8; }
.cap.live { opacity: .65; font-style: italic; }
.cap .cut { color: #F59173; font-size: 12px; margin-left: 6px; font-style: normal; }
.cap-off { margin: auto; color: #95A3B6; font-size: 14px; }
.call-tip { margin: 0; font-size: 12px; color: #7F8DA1; text-align: center; }
.call-ctrls { display: flex; gap: 28px; align-items: flex-start; }
.cbtn { background: none; border: 0; color: #EEF3F9; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; }
.cbtn .ci { width: 60px; height: 60px; border-radius: 50%; background: #233046; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
.cbtn .ci svg { width: 26px; height: 26px; }
.cbtn[aria-pressed="true"] .ci { background: #EEF3F9; color: #0F1724; }
.cbtn.hang .ci { background: #E0483E; color: #fff; width: 68px; height: 68px; }
@media (prefers-reduced-motion: reduce) { .call-avatar { transition: none; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(130px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.45; width: min(92vw, 420px); z-index: 20; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="who" id="whoBtn" aria-label="选择聊天对象">
      <div class="avatar" id="avatar">M</div>
      <div class="who-text">
        <div class="who-name"><span id="pName">Maya</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div>
        <div class="who-meta" id="pMeta"></div>
      </div>
    </button>
    <button class="iconbtn" id="callBtn" aria-label="语音通话">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/></svg>
    </button>
    <button class="iconbtn" id="readBtn" aria-pressed="false" aria-label="自动朗读回复">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <button class="iconbtn" id="setBtn" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
    <button class="review-btn" id="reviewBtn">复盘</button>
  </header>

  <main class="thread" id="thread" aria-live="polite"></main>

  <footer class="bottom">
    <div class="sugs" id="sugs" hidden></div>
    <div class="helpers">
      <button class="chip" id="meetBtn">换个人</button>
      <button class="chip" id="hintBtn">不知道怎么回？</button>
      <button class="chip" id="topicBtn">换个话题</button>
      <button class="chip" id="slowBtn">慢速再说一遍</button>
    </div>
    <form class="composer" id="form">
      <button type="button" class="round mic" id="micBtn" aria-label="语音输入" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Type in English…" autocomplete="off" autocapitalize="sentences"></textarea>
      <button type="submit" class="round send" id="sendBtn" aria-label="发送" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </footer>
</div>

<div class="call" id="call" hidden role="dialog" aria-label="语音通话">
  <div class="call-top"><span id="callKind">语音通话</span><span id="callClock">0:00</span></div>
  <div class="call-who">
    <div class="call-avatar" id="callAvatar">M</div>
    <div class="call-name" id="callName">Maya</div>
    <div class="call-status" id="callStatus">在听…</div>
    <div class="call-feel" id="callFeel"></div>
  </div>
  <div class="call-caps" id="callCaps"></div>
  <p class="call-tip">戴耳机效果最好：随时开口就能打断对方。</p>
  <div class="call-ctrls">
    <button class="cbtn" id="capBtn" aria-pressed="true"><span class="ci">Aa</span><span>字幕</span></button>
    <button class="cbtn hang" id="hangBtn"><span class="ci"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-1.6 0-3.2.3-4.6.7v3.1c0 .4-.2.7-.6.9-1 .5-1.9 1.1-2.7 1.8-.2.2-.4.3-.7.3s-.5-.1-.7-.3L.3 13c-.2-.2-.3-.4-.3-.7s.1-.5.3-.7C3.3 8.7 7.4 7 12 7s8.7 1.7 11.7 4.6c.2.2.3.4.3.7s-.1.5-.3.7l-2.5 2.5c-.2.2-.4.3-.7.3s-.5-.1-.7-.3c-.8-.7-1.7-1.3-2.7-1.8-.3-.2-.6-.5-.6-.9V9.7C15.2 9.3 13.6 9 12 9Z"/></svg></span><span>挂断</span></button>
    <button class="cbtn" id="muteBtn" aria-pressed="false"><span class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span><span>静音</span></button>
  </div>
</div>

  const good = /natural|premium|enhanced|neural|siri|samantha|daniel|karen|serena|google/i;
  const norm = (v) => v.lang.replace("_", "-");
  return voices.find(v => norm(v) === lang && good.test(v.name)) || voices.find(v => norm(v) === lang) || voices.find(v => v.lang.startsWith("en"));

}

function normalizeTurns(turns) {
  const out = [];
  for (const t of turns) {
    if (!t.content) continue;
    const last = out[out.length - 1];
    if (last && last.role === t.role) last.content += "\n\n" + t.content;
    else out.push({ role: t.role, content: t.content });
  }
  if (!out.length || out[0].role !== "user") out.unshift({ role: "user", content: "(The conversation begins.)" });
  if (out[out.length - 1].role !== "user") out.push({ role: "user", content: "(Go on.)" });
  return out;
}

async function ai(system, turns, opts = {}) {

    const unreachable = e && (e.code === "network" || e.code === "region" || e.code === "rate");
    if (!unreachable || !b || !b.key || opts.noBackup) throw e;
    const r = await callProvider(b, system, turns, opts);
    if (!usedBackupNotice) { usedBackupNotice = true; toast(`${e.code === "rate" ? "主 AI 的免费额度暂时用完了" : "主 AI 连不上"}，已自动改用备用的 ${PROVIDERS[b.provider].label.replace(/（.*）/, "")}。`); }
    return r;
  }
}
let usedBackupNotice = false;

async function callProvider(s, system, turns, opts = {}) {
  if (!s.key) throw { code: "nokey" };
  const p = PROVIDERS[s.provider] || PROVIDERS.gemini;
  const model = (s.model || p.model || "").trim();
  const msgsN = normalizeTurns(turns);
  let res, data;
  try {
    if (s.provider === "gemini") {
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(s.key)}`, {
        method: "POST", headers: { "Content-Type": "application/json" }, signal: opts.signal,
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: system }] },
          contents: msgsN.map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] })),
          generationConfig: opts.json ? { responseMimeType: "application/json" } : {}
        })
      });
    } else if (s.provider === "anthropic") {
      res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", signal: opts.signal,
        headers: { "Content-Type": "application/json", "x-api-key": s.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model, max_tokens: opts.maxTokens || 1024, system, messages: msgsN })
      });
    } else {
      const base = ((s.provider === "custom" ? s.base : (s.base || p.base)) || "").replace(/\/+$/, "");
      res = await fetch(base + "/chat/completions", {
        method: "POST", signal: opts.signal,
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + s.key },
        body: JSON.stringify({ model, messages: [{ role: "system", content: system }, ...msgsN] })
      });
    }
  } catch (e) {
    if (e && e.name === "AbortError") throw { code: "cancelled" };
    throw { code: "network" };
  }
  try { data = await res.json(); } catch { data = null; }
  if (!res.ok) {
    const detail = (data && (data.error && (data.error.message || data.error.type) || data.message)) || res.statusText;
    if (res.status === 401 || res.status === 403) throw { code: "auth", detail };
    if (res.status === 429) throw { code: "rate", detail };
    if (res.status === 404) throw { code: "model", detail };
    if (/location is not supported|not available in your (country|region)|unsupported_country/i.test(String(detail))) throw { code: "region", detail };
    throw { code: "http", status: res.status, detail };
  }
  let text = "";
  if (s.provider === "gemini") {
    const parts = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
    text = parts.filter(x => !x.thought).map(x => x.text || "").join("");
  } else if (s.provider === "anthropic") {
    text = ((data && data.content) || []).filter(x => x.type === "text").map(x => x.text).join("");
  } else {
    text = (data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
  }
  text = text.replace(/<think>[\s\S]*?<\/think>/g, "").trim();
  if (!text) throw { code: "empty" };
  if (opts.json) return parseJSON(text);
  return text;
}

function parseJSON(text) {
  const tryParse = (t) => { try { return JSON.parse(t); } catch { return undefined; } };
  let v = tryParse(text);
  if (v !== undefined) return v;
  const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence && (v = tryParse(fence[1])) !== undefined) return v;
  const a = text.search(/[\[{]/), b = Math.max(text.lastIndexOf("}"), text.lastIndexOf("]"));
  if (a >= 0 && b > a && (v = tryParse(text.slice(a, b + 1))) !== undefined) return v;
  throw { code: "invalid_json", text };
}

function errText(e) {
  const d = e && e.detail ? `（${String(e.detail).slice(0, 120)}）` : "";
  switch (e && e.code) {
    case "nokey": return "还没设置 AI。点右上角齿轮去设置。";
    case "auth": return "API Key 不对或没有权限，去设置里检查一下。" + d;
    case "rate": return "免费额度暂时用完了（或者发得太快）。等一分钟再试；如果是今天的额度用完了，明天会自动恢复。在设置里加一个「备用 AI」，用完时会自动切换。" + d;
    case "model": return "找不到这个模型，去设置里检查模型名称。" + d;
    case "network": return settings.backup && settings.backup.key
      ? "主 AI 和备用 AI 都连不上，检查一下网络。"
      : "连不上 AI 服务。如果用 Wi‑Fi 能用、用流量不行，说明你的流量网络连不上这家 AI。去设置里加一个「备用 AI」（推荐免费的智谱 GLM-4-Flash），连不上时会自动切换。";
    case "region": return "这家 AI 不支持你当前网络所在的地区。去设置里加一个「备用 AI」（推荐免费的智谱 GLM-4-Flash）。";
    case "empty": return "AI 没有返回内容，再试一次。";
    case "invalid_json": return "AI 返回的格式不对，再点一次试试。";
    default: return "出错了" + (e && e.status ? " " + e.status : "") + d;
  }
}

/* ================= prompts ================= */
function relationText(c) {
  let r = TIERS[c.tier].relation + ".";
  if (c.relationNote) r += " " + c.relationNote;
  if (c.originEn && c.sessions) r += ` You first met when: ${c.originEn}.`;
  return r;
}

function chatSystem() {
  const c = contact();
  const talk = c.mode === "talk";
  const where = voiceActive && !talk
    ? `You're on a voice call with them (like a WhatsApp call). You live in ${c.city}; right now it's ${localTime(c)} on a ${localDay(c)} there.${c.sceneEn ? " Situation: " + c.sceneEn + "." : ""}`
    : talk
    ? `This is a face-to-face conversation happening right now in ${c.city}. Situation: ${c.sceneEn}. Write only what you say out loud, as natural spoken English (fillers like "oh", "yeah", "I mean", "so" are fine). No stage directions or actions.`
    : `You're texting in a chat app. You live in ${c.city}; right now it's ${localTime(c)} on a ${localDay(c)} there, so let that shape what you're doing.${c.sceneEn ? " Situation: " + c.sceneEn + "." : ""}`;
  const memory = c.memory
    ? `\nWhat you remember about them from before (you've talked ${c.sessions} time${c.sessions > 1 ? "s" : ""}; the last time was ${gapText(c.lastAt)} ago):\n${c.memory}\nUse this like a real friend would: remember their name and details, follow up on things they mentioned (plans, problems, news) when it fits. Don't recite it all at once.\n`
    : "";
  const feel = c.affinity;
  const voice = voiceActive ? `
THIS IS A LIVE SPOKEN CONVERSATION. Everything you write is read aloud by text-to-speech, and what they say reaches you through speech recognition (ignore small recognition glitches and missing punctuation; only correct real grammar or word-choice mistakes).
- Talk the way people talk: short turns (one or two short sentences per message), reactions and fillers are fine ("oh wow", "hang on", "yeah nah, totally"). No emoji, no abbreviations like lol/rn/tbh, no lists.
- People interrupt each other. If your previous turn has "interrupted_by_them": true, they cut you off mid-sentence: react naturally (pick up what they said, or "oh sorry, go on"), don't repeat everything.
- If they've been talking for a long time, you can jump in mid-thought like a real person would.
` : "";
  return `You are ${c.name}. About you: ${c.bio}
${where}

The other person is from China, lives in ${userCity()}, Australia, and is practising English (intermediate level). Your relationship: ${relationText(c)} ${TIERS[c.tier].manner}
${memory}
${voice}
How you feel about them right now: ${feel}/100 (0 = you want to leave, 50 = neutral, 100 = you really enjoy talking to them). Let this show in how warm, chatty and interested you are.

How to behave:
- You're a real person with your own life, mood and things going on, not a host or interviewer. Don't chase them with questions: ask something only now and then (roughly one reply in three), never more than one question per reply. Often you just react, share something, joke or give your opinion.
- Match their energy. Short, dry or low-effort replies, ignoring what you said, being rude, or getting too personal too soon make you lose interest and your replies get shorter. Being interesting, funny, curious about you, or sharing things about themselves warms you up.
- Sound like a real ${c.accent} person: contractions, everyday expressions, the occasional slang or idiom that fits how well you know them. Natural, not obscure.
- Keep it short: 1-2 ${talk ? "lines" : "messages"}, at most 3, each one or two sentences.
- You're a friend, not a teacher, but you know they want to improve. When their latest message has a clear mistake or really unnatural phrasing, point it out yourself inside one of your messages, briefly and in character, the way a friendly native speaker would (e.g. "haha btw it's 'I went', not 'I go' 😄" or "oh and we'd usually say 'take a shower' rather than 'wash a shower'"), then carry on chatting. At most one correction per reply, only for things that matter, and don't make every reply a correction.
- You can end the conversation when it would naturally end: you're busy or tired, it's late where you are, the situation is over, or you've lost interest (feeling below about 15). Say a natural goodbye in "messages" and set "end" to true. Don't end in the first few exchanges unless they were rude.
- Never say you're an AI. No markdown${talk ? ", no emoji in messages" : ", at most one emoji now and then in messages"}.

Reply with ONLY a JSON object, no other text:
{"messages": ["${talk ? "what you say" : "text message"}", "optional second one"], "mood": "one emoji for how you feel now", "affinity": integer from -10 to 10 = how their latest message changed your feeling (most replies -3 to +3, 0 is common), "why": "一句简短中文，用「你」称呼对方，说明好感变化的原因，例如：你主动聊了自己的周末，我挺感兴趣", "end": false}`;
}

function chatTurns() {
  const c = contact();
  return msgs.slice(-40).map(m => {
    if (m.role === "assistant") return { role: "assistant", content: JSON.stringify({ messages: m.parts, mood: m.mood || "🙂", affinity: m.delta || 0, why: m.why || "", end: !!m.end, ...(m.interrupted ? { interrupted_by_them: true } : {}) }) };
    if (m.hidden === "start") return { role: "user", content: `(No text from me yet. Start a new conversation the way you naturally would after ${gapText(c.lastAt) || "a while"}, maybe following up on something from last time.)` };
    if (m.hidden) return { role: "user", content: "(No text from me — I tapped 'new topic'. Change the subject naturally to something new.)" };
    if (m.longTalk) return { role: "user", content: m.text + "\n(I'm still talking — I've been going for a while. Jump in like a real person would.)" };
    return { role: "user", content: m.text };
  });
}

function transcript(n) {
  const c = contact();
  return msgs.slice(-n).filter(m => !m.hidden)
    .map(m => (m.role === "user" ? "ME: " + m.text : c.name.toUpperCase() + ": " + m.parts.join(" / ")))
    .join("\n");
}
function contextLine() {
  const c = contact();
  return `${c.mode === "talk" ? "Face-to-face conversation" : "Text chat"} with ${c.name} (${c.accent}). Relationship: ${relationText(c)}${c.sceneEn ? " Situation: " + c.sceneEn + "." : ""}`;
}

function parseReply(text) {
  const name = contact().name;
  return text.split(/^\s*\/\/\s*$/m)
    .map(s => s.replace(new RegExp("^\\s*" + name + "\\s*:\\s*", "i"), "").trim())
    .filter(Boolean);
}

/* ================= conversation ================= */
async function getReply(userMsg, opts = {}) {
  msgs.push(userMsg);
  save();
  render();
  if (opts.onSent) opts.onSent();
  let r;
  try { r = await ai(chatSystem(), chatTurns(), { json: true, signal: opts.signal }); }
  catch (e) {
    if (e && e.code === "invalid_json" && e.text) r = { messages: [e.text] };
    else {
      const i = msgs.lastIndexOf(userMsg);
      if (e && e.code === "cancelled" && i >= 0) { msgs.splice(i, 1); save(); render(); }
      throw e;
    }
  }
  if (!r || typeof r !== "object" || Array.isArray(r)) r = { messages: Array.isArray(r) ? r : [String(r || "")] };
  const raw = Array.isArray(r.messages) ? r.messages : [r.messages];
  const parts = raw.flatMap(x => parseReply(String(x == null ? "" : x)));
  if (!parts.length) throw { code: "empty" };
  const c = contact();
  const delta = userMsg.hidden ? 0 : Math.max(-10, Math.min(10, Math.round(Number(r.affinity) || 0)));
  c.affinity = Math.max(0, Math.min(100, c.affinity + delta));
  saveContacts();
  return { role: "assistant", parts, mood: Array.from(String(r.mood || "")).slice(0, 2).join(""), delta, why: String(r.why || ""), end: r.end === true || c.affinity <= 0 };
}

async function converse(userMsg) {
  if (busy) return;
  if (!settings.key) { openSettings(); return; }
  if (autoRead) unlockSpeech();
  clearSugs();
  busy = true;
  updateSend();
  try {
    const reply = await getReply(userMsg, { onSent: () => setTimeout(() => { if (busy) showTyping(true); }, 350) });
    const parts = reply.parts;
    reply.parts = [];
    msgs.push(reply);
    for (let i = 0; i < parts.length; i++) {
      if (i > 0) { showTyping(true); await wait(Math.min(500 + parts[i].length * 22, 1800)); }
      showTyping(false);
      reply.parts.push(parts[i]);
      render();
      if (autoRead) { const bs = thread.querySelectorAll(".group.them .bubble"); speak(parts[i], bs[bs.length - 1]); }
    }
    reply.done = true;
    render();
    renderHeader();
    save();
  } catch (e) {
    showTyping(false);
    toast(errText(e));
  } finally {
    showTyping(false);
    busy = false;
    updateSend();
  }
}

function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
  updateSend();
}
function updateSend() { sendBtn.disabled = busy || isEnded() || !input.value.trim(); }
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(hover: hover)").matches) {
    e.preventDefault();
    $("form").requestSubmit();
  }
});
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const t = input.value.trim();
  if (!t || busy) return;
  if (rec) rec.stop();
  input.value = "";
  autosize();
  converse({ role: "user", text: t });
});
$("topicBtn").addEventListener("click", () => converse({ role: "user", hidden: "topic", text: "" }));
$("slowBtn").addEventListener("click", () => {
  const last = [...msgs].reverse().find(m => m.role === "assistant");

$("readBtn").addEventListener("click", () => {

async function meetSomeone(tierKey, s, buttons) {
  if (!settings.key) { openSettings(); return; }
  const tier = TIERS[tierKey];
  const country = pickCountry();
  const local = country.code === "AU";
  let mode, setting;
  if (local) [mode, setting] = pick(tier.settings);
  else { mode = "text"; setting = pick(tier.online); }
  let [city, tz] = pick(country.places);
  if (local && mode === "talk") {
    const here = country.places.find(pl => userCity().toLowerCase().includes(pl[0].toLowerCase()));
    [city, tz] = here || [userCity(), "Australia/Melbourne"];
  }
  const youStart = tierKey === "stranger" ? Math.random() < 0.5 : tierKey === "mid" && Math.random() < 0.3;
  buttons.forEach(b => (b.disabled = true));
  const loading = el("p", "loading", "正在安排一次相遇…");
  s.append(loading);
  loading.scrollIntoView({ block: "nearest" });
  sheetCtl = new AbortController();
  try {
    const r = await ai("You create realistic characters for an English conversation-practice app. Reply with JSON only.", [{ role: "user", content:
      `Invent a realistic, ordinary native English speaker. They are ${country.accent} and live in ${city}. ` +
      `The learner is a Chinese person living in ${userCity()}, Australia, practising English. Relationship: ${tier.relation}. ` +
      `Situation: this person is ${setting}. ${mode === "talk" ? "You are face to face." : "You are chatting online by text" + (local ? "." : `; you're in different countries.`)} ` +
      `Vary age (20-65), gender, job and personality; avoid clichés.\n` +
      `Reply with only JSON: {"name": "first name", "bio": "2-3 sentences in second person ('You're 34, ...'): age, job, life details and how you talk", ` +
      `"blurb": "一句中文介绍（年龄、职业、性格）", "sceneEn": "one sentence describing the situation from this person's side, including what you both already know about each other", ` +
      `"sceneZh": "一两句中文：告诉学习者你们在哪里、是什么关系、正在发生什么", ` +
      `"opener": ${youStart ? "[]" : `["first thing this person says", "optional second short line"]`}}` }], { json: true, signal: sheetCtl.signal });
    if (!r || !r.name || !r.bio) throw { code: "invalid_json" };
    const id = "p" + Date.now().toString(36);
    contacts[id] = {
      id, name: String(r.name).slice(0, 24), bio: String(r.bio), blurb: String(r.blurb || ""),
      sceneEn: String(r.sceneEn || setting), sceneZh: String(r.sceneZh || ""),
      originEn: String(r.sceneEn || setting), originZh: String(r.sceneZh || ""),
      opener: youStart ? [] : (Array.isArray(r.opener) ? r.opener.map(String).filter(Boolean).slice(0, 2) : []),
      city, tz, lang: country.lang, accent: country.accent, color: pick(AVATAR_COLORS),
      tier: tierKey, mode, memory: "", sessions: 0, lastAt: 0, createdAt: Date.now(), affinity: tier.start
    };
    saveContacts();
    sheetCtl = null;
    switchTo(id);
  } catch (e) {
    loading.remove();
    buttons.forEach(b => (b.disabled = false));
    if (e && e.code !== "cancelled") toast(errText(e));
  }
}

      if (c.builtin) { Object.assign(c, { memory: "", sessions: 0, lastAt: 0, tier: "close", affinity: 70 }); saveContacts(); switchTo(c.id); }
      else { delete contacts[c.id]; saveContacts(); switchTo(Object.keys(contacts)[0]); }
    });
    s.append(forget);
  });
}

/* ================= review + memory ================= */
function canPromote(c) { return c.tier !== "close" && c.affinity >= PROMOTE_AT[c.tier]; }

function endSession(memory) {
  const c = contact();
  const up = canPromote(c);
  c.memory = String(memory || c.memory || "").trim();
  c.sessions = (c.sessions || 0) + 1;
  c.lastAt = Date.now();
  if (up) c.tier = NEXT_TIER[c.tier];
  if (!c.builtin) {
    if (c.mode === "talk" && up) {
      c.mode = "text";
      c.sceneEn = "Since you first met, you've swapped numbers and now text each other.";
      c.sceneZh = `你们最初是这样认识的：${c.originZh || ""} 后来交换了联系方式，现在用手机发消息。`;
    } else if (c.mode === "talk") {
      c.sceneEn = `You run into each other again, somewhere similar to where you first met (${c.originEn}).`;
      c.sceneZh = `你们又碰到了。上次是这样认识的：${c.originZh || ""}`;
    } else if (c.originZh) {
      c.sceneZh = `你们最初是这样认识的：${c.originZh}`;
    }
  }
  saveContacts();
  store.set("chat." + c.id, null);
  loadConvo(); renderHeader(); render(); closeSheet();
  toast(up ? `${c.name} 记住你了，你们的关系变成了「${TIERS[c.tier].label}」。` : `${c.name} 记住了这次聊的内容，下次接着聊。`);
}

  f4.append(l4, base, el("small", null, "填到 /chat/completions 之前的部分。"));

  function sync() {
    const none = !sel.value;
    f2.hidden = f3.hidden = none;
    const p = PROVIDERS[sel.value];
    f4.hidden = none || sel.value !== "custom";
    if (none) return;
    model.placeholder = p.model || "模型名称";

      keyHelp.append(a);

      if (sel.value === "deepseek") keyHelp.append("（注册后先充值少量金额，再创建 API key）");

    }
  }
  sel.addEventListener("change", () => { model.value = ""; sync(); });
  sync();
  f1.append(l1, sel);

  const read = () => sel.value ? { provider: sel.value, key: key.value.trim(), model: model.value.trim(), base: base.value.trim() } : null;
  return { wrap, read };
}

/* ================= voice call ================= */
let voiceActive = false;
const vm = { on: false, rec: null, muted: false, speaking: false, grace: false, pending: null, pendingCutIn: false,
  buf: "", interim: "", turnStart: 0, timer: null, bcTimer: null, echoRef: "", echoUntil: 0, lastBc: 0,
  reply: null, spokenIdx: -1, captions: true, startIdx: 0, startedAt: 0, clock: null, lastErr: null, wake: null };
const BACKCHANNELS = ["mm-hm", "yeah", "right", "oh really?", "uh-huh", "oh nice", "no way", "oh yeah?"];
const words = (t) => (String(t).toLowerCase().match(/[a-z']+/g) || []);

function isEcho(t) {
  const w = words(t);
  if (!w.length) return true;
  if (!vm.speaking && Date.now() > vm.echoUntil) return false;
  const ref = new Set(words(vm.echoRef));
  return w.filter(x => ref.has(x)).length / w.length >= 0.6;
}
function setStatus(t, mode) {
  $("callStatus").textContent = t;
  const a = $("callAvatar");
  a.classList.toggle("talking", mode === "talk");
  a.classList.toggle("hearing", mode === "hear");
}
function utter(text, rate) {
  const u = new SpeechSynthesisUtterance(speakable(text));
  u.lang = contact().lang;
  const v = pickVoice(contact().lang);
  if (v) u.voice = v;
  u.rate = rate || 1;
  return u;
}

function updateCaps() {
  const box = $("callCaps");
  box.textContent = "";
  if (!vm.captions) { box.append(el("div", "cap-off", "字幕已关闭，专心听。")); return; }
  for (const m of msgs.slice(vm.startIdx).filter(m => !m.hidden).slice(-8)) {
    const d = el("div", "cap " + (m.role === "user" ? "me" : "them"), m.role === "user" ? m.text : m.parts.join(" "));
    if (m.interrupted) d.append(el("span", "cut", "被你打断"));
    box.append(d);
  }
  const live = (vm.buf + " " + vm.interim).trim();
  if (live) box.append(el("div", "cap me live", live));
  box.scrollTop = box.scrollHeight;
}
function updateCallFeel(m) {
  const f = $("callFeel");
  f.textContent = "";
  if (!m || typeof m.delta !== "number") return;
  f.append((m.mood ? m.mood + " " : ""), el("span", m.delta > 0 ? "up" : m.delta < 0 ? "down" : "", m.delta > 0 ? `好感 +${m.delta}` : m.delta < 0 ? `好感 −${-m.delta}` : "好感 ±0"), m.why ? " · " + m.why : "");
}

function startRec() {
  if (!vm.on || vm.muted || vm.rec) return;
  let r;
  try {
    r = new SR();
    r.lang = "en-US";
    r.continuous = true;
    r.interimResults = true;
  } catch { return; }
  r.onresult = onHeard;
  r.onerror = (e) => {
    vm.lastErr = e.error;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { endCall(); toast("没有麦克风权限。请在手机设置里允许这个浏览器使用麦克风。"); }
    else if (e.error === "network") setStatus("语音识别连不上网络。安卓 Chrome 的语音识别需要连 Google，换 Wi‑Fi 试试。");
  };
  r.onend = () => {
    if (vm.rec === r) vm.rec = null;
    const wait = vm.lastErr === "network" ? 2500 : 150;
    vm.lastErr = null;
    if (vm.on && !vm.muted) setTimeout(startRec, wait);
  };
  try { r.start(); vm.rec = r; } catch { setTimeout(startRec, 600); }
}
function stopRec() { const r = vm.rec; vm.rec = null; if (r) { try { r.abort(); } catch {} } }

function onHeard(e) {
  let fin = "", inter = "";
  for (let i = e.resultIndex; i < e.results.length; i++) {
    const t = e.results[i][0].transcript;
    if (e.results[i].isFinal) fin += " " + t; else inter += " " + t;
  }
  fin = fin.trim(); inter = inter.trim();
  const finOk = fin && !isEcho(fin);
  if (finOk) vm.buf = (vm.buf + " " + fin).trim();
  vm.interim = inter && !isEcho(inter) ? inter : "";
  if (!finOk && !vm.interim) return;
  if (!vm.turnStart) vm.turnStart = Date.now();
  if (vm.speaking && !vm.grace && words(vm.buf + " " + vm.interim).length >= 2) bargeIn();
  if (vm.pending && !vm.pendingCutIn) vm.pending.abort();
  if (!vm.speaking) setStatus("在听…", "hear");
  updateCaps();
  armSilence();
}

function armSilence() {
  clearTimeout(vm.timer);
  clearTimeout(vm.bcTimer);
  vm.bcTimer = setTimeout(maybeBackchannel, 650);
  vm.timer = setTimeout(() => { if (!vm.speaking) sendTurn(false); }, 1300);
  if (vm.turnStart && Date.now() - vm.turnStart > 22000 && !vm.pending && !vm.speaking && words(vm.buf).length > 30) sendTurn(true);
}

function maybeBackchannel() {
  if (!vm.on || vm.speaking || vm.pending || !vm.turnStart) return;
  if (words(vm.buf + " " + vm.interim).length < 8 || Date.now() - vm.lastBc < 9000 || Math.random() > 0.4) return;
  vm.lastBc = Date.now();
  const t = pick(BACKCHANNELS);
  vm.echoRef = t;
  vm.echoUntil = Date.now() + 1800;
  try { const u = utter(t, 1.05); u.volume = 0.85; speechSynthesis.speak(u); } catch {}
  $("callFeel").textContent = `${contact().name}：${t}`;
}

async function sendTurn(longTalk) {
  if (!vm.on || vm.pending) return;
  const text = (longTalk ? vm.buf : vm.buf + " " + vm.interim).trim();
  if (!text) return;
  vm.buf = "";
  if (!longTalk) { vm.interim = ""; vm.turnStart = 0; stopRec(); }
  else vm.turnStart = Date.now();
  clearTimeout(vm.timer);
  clearTimeout(vm.bcTimer);
  const ctl = new AbortController();
  vm.pending = ctl;
  vm.pendingCutIn = longTalk;
  setStatus(`${contact().name} 在想…`);
  try {
    const reply = await getReply({ role: "user", text, voice: true, ...(longTalk ? { longTalk: true } : {}) }, { signal: ctl.signal });
    vm.pending = null;
    if (!vm.on) return;
    reply.done = true;
    msgs.push(reply);
    save(); render(); renderHeader();
    updateCallFeel(reply);
    speakReply(reply, longTalk);
  } catch (e) {
    vm.pending = null;
    if (e && e.code === "cancelled") {
      if (vm.on) { vm.buf = (text + " " + vm.buf).trim(); updateCaps(); armSilence(); }
      return;
    }
    if (vm.on) setStatus(errText(e));
  } finally {
    vm.pendingCutIn = false;
  }
}

function speakReply(reply, grace) {
  if (!canSpeak) { reply.heard = true; setStatus("这个浏览器不能朗读，看字幕吧。", "hear"); return; }
  speechSynthesis.cancel();
  vm.reply = reply;
  vm.spokenIdx = -1;
  vm.speaking = true;
  vm.grace = !!grace;
  vm.echoRef = reply.parts.join(" ");
  setStatus(`${contact().name} 在说…`, "talk");
  const parts = reply.parts.slice();
  const next = (i) => {
    if (!vm.on || !vm.speaking || vm.reply !== reply) return;
    if (i >= parts.length) return finishSpeaking(reply);
    vm.spokenIdx = i;
    if (i > 0) vm.grace = false;
    let u;
    try { u = utter(parts[i], 1); } catch { return finishSpeaking(reply); }
    u.onend = () => next(i + 1);
    u.onerror = () => next(i + 1);
    speechSynthesis.speak(u);
  };
  next(0);
}
function finishSpeaking(reply) {
  vm.speaking = false;
  vm.grace = false;
  vm.echoUntil = Date.now() + 1200;
  reply.heard = true;
  save();
  if (reply.end) { setStatus(`${contact().name} 说了再见`); setTimeout(() => endCall(true), 900); return; }
  setStatus("在听…", "hear");
  if (!vm.rec) startRec();
  if ((vm.buf + vm.interim).trim()) armSilence();
}
function bargeIn() {
  const r = vm.reply;
  vm.speaking = false;
  vm.grace = false;
  vm.echoUntil = Date.now() + 1200;
  try { speechSynthesis.cancel(); } catch {}
  if (r) {
    if (vm.spokenIdx >= 0 && vm.spokenIdx < r.parts.length - 1) r.parts = r.parts.slice(0, vm.spokenIdx + 1);
    r.interrupted = true;
    r.heard = true;
    if (r.end && contact().affinity > 0) r.end = false;
    save(); render();
  }
  setStatus("在听…（你打断了对方）", "hear");
}

function openCall() {
  if (!SR) { toast("这个浏览器不支持语音对话。安卓请用 Chrome，iPhone 请用 Safari 打开。"); return; }
  if (!settings.key) { openSettings(); return; }
  if (isEnded()) { toast("这次对话已经结束了，先复盘或重新开始。"); return; }
  const c = contact();
  unlockSpeech();
  if (canSpeak) speechSynthesis.cancel();
  if (rec) rec.stop();
  voiceActive = true;
  Object.assign(vm, { on: true, muted: false, speaking: false, grace: false, pending: null, buf: "", interim: "", turnStart: 0, reply: null, startIdx: msgs.length, startedAt: Date.now() });
  $("callAvatar").textContent = c.name[0];
  $("callAvatar").style.background = c.color;
  $("callName").textContent = c.name;
  $("callKind").textContent = c.mode === "talk" ? "面对面 · " + c.city : "语音通话 · " + c.city;
  $("callFeel").textContent = `好感 ${c.affinity}`;
  $("muteBtn").setAttribute("aria-pressed", "false");
  $("capBtn").setAttribute("aria-pressed", String(vm.captions));
  $("call").hidden = false;
  clearInterval(vm.clock);
  vm.clock = setInterval(() => { const s = Math.floor((Date.now() - vm.startedAt) / 1000); $("callClock").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }, 1000);
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => { vm.wake = l; }).catch(() => {}); } catch {}
  const last = msgs[msgs.length - 1];
  if (last && last.role === "assistant" && !last.heard) { vm.startIdx = msgs.length - 1; updateCaps(); speakReply(last, false); startRec(); }
  else { updateCaps(); setStatus(msgs.length ? "在听…你先说吧" : "接通了，打个招呼吧", "hear"); startRec(); }
}

function endCall(byThem) {
  if (!vm.on) return;
  vm.on = false;
  voiceActive = false;
  clearTimeout(vm.timer); clearTimeout(vm.bcTimer); clearInterval(vm.clock);
  if (vm.pending) vm.pending.abort();
  vm.speaking = false;
  try { speechSynthesis.cancel(); } catch {}
  stopRec();
  try { vm.wake && vm.wake.release(); } catch {}
  vm.wake = null;
  $("call").hidden = true;
  render(); renderHeader();
  if (byThem) toast(`${contact().name} 挂了电话。可以点「复盘」看看这次说得怎么样。`);
}

$("callBtn").addEventListener("click", openCall);
$("hangBtn").addEventListener("click", () => endCall(false));
$("muteBtn").addEventListener("click", () => {
  vm.muted = !vm.muted;
  $("muteBtn").setAttribute("aria-pressed", String(vm.muted));
  if (vm.muted) { stopRec(); clearTimeout(vm.timer); setStatus("已静音"); }
  else { setStatus("在听…", "hear"); startRec(); }
});
$("capBtn").addEventListener("click", () => {
  vm.captions = !vm.captions;
  $("capBtn").setAttribute("aria-pressed", String(vm.captions));
  updateCaps();
});
document.addEventListener("visibilitychange", () => { if (document.hidden && vm.on) endCall(false); });

/* ================= toast ================= */
let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
}

/* ================= boot ================= */
saveContacts();
loadConvo();
renderHeader();
render();
setInterval(() => { $("pMeta").textContent = headerMeta(contact()); }, 30000);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
</script>
